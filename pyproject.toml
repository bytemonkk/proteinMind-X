[project]
name = "proteinmind-x"
version = "0.1.0"
description = "Evidence-augmented protein intelligence system"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
